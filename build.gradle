plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

group = project.group
description = project.displayname
version = project.mod_version

base {
    archivesName = project.name
}

sourceSets {
    main {
        java {
            // Kept in the repository while the pre-26.2 immediate-mode renderer is
            // replaced with the new render-state submission API.
            exclude 'com/invasion/client/render/entity/**'
            exclude 'com/invasion/client/particle/**'
            exclude 'com/invasion/mixin/client/**'
        }
    }
}


loom {
    // Minecraft 26.2 is unobfuscated; no Yarn mappings or remapping step is needed.
}

repositories {
    mavenLocal()
    maven { name 'modmenu'; url 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    /*
    compile "mcp.mobius.waila:Waila:${waila_version}_${mc_version}"
    compile "codechicken:CodeChickenCore:1.7.10-1.0.7.48:dev"
    compile "codechicken:CodeChickenLib:1.7.10-1.1.3.141:dev"
    compile "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
    compile fileTree(dir: 'libs', include: '*.jar')
    */

}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version.toString()

    filesMatching("fabric.mod.json") {
        expand "version": project.version.toString(),
                "minecraftVersion": ">=${project.minecraft_version}",
                "loaderVersion": ">=${project.loader_version}",
                "fabricVersion": ">=${project.fabric_version}"
    }

    from 'LICENSE'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
