plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

group = project.group
description = project.displayname
version = project.mod_version

base {
    archivesName = project.name
}

tasks.named('jar') {
    archiveFileName = "${project.name}-${project.version}-26.2fabric.jar"
}

sourceSets {
    main {
        java {
            // Kept in the repository while the pre-26.2 immediate-mode renderer is
            // replaced with the new render-state submission API.
            exclude 'com/invasion/client/render/entity/**'
            exclude 'com/invasion/client/particle/**'
            exclude 'com/invasion/mixin/client/**'
        }
    }
}


loom {
    // Minecraft 26.2 is unobfuscated; no Yarn mappings or remapping step is needed.
}

repositories {
    mavenLocal()
    maven { name 'modmenu'; url 'https://maven.terraformersmc.com/releases' }
    maven { name 'jei'; url 'https://maven.blamejared.com' }
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.terraformersmc:modmenu:20.0.1"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly "maven.modrinth:mutant-monsters:${project.mutant_monsters_version}"
    compileOnly "maven.modrinth:POQ2i9zu:fabric-4.0.27+mc26.2"
    compileOnly "maven.modrinth:G1hIVOrD:5.0.3"

    /*
    compile "mcp.mobius.waila:Waila:${waila_version}_${mc_version}"
    compile "codechicken:CodeChickenCore:1.7.10-1.0.7.48:dev"
    compile "codechicken:CodeChickenLib:1.7.10-1.1.3.141:dev"
    compile "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
    compile fileTree(dir: 'libs', include: '*.jar')
    */

    testImplementation platform('org.junit:junit-bom:6.0.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version.toString()

    filesMatching("fabric.mod.json") {
        expand "version": project.version.toString(),
                "minecraftVersion": ">=${project.minecraft_version}",
                "loaderVersion": ">=${project.loader_version}",
                "fabricVersion": ">=${project.fabric_version}"
    }

    from 'LICENSE'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
